spring.application.name=Api-Management-Service
server.port=8081

info.app.name=API Management Service
info.app.description=Management Service for users,routes and gateway policies

spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

security.jwt.expiration-seconds=3600
security.jwt.secret=${JWT_SECRET}

gateway.kafka.configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC}
spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS}